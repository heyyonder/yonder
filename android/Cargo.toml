# The Android app of Yonder. It runs the same React app as the Mac app (src/), and the phone talks to the
# bridge on the Mac through the relay, as the iPhone app (ios/) does. See docs/mobile.md.
[package]
name = "yonder-android"
version = "0.1.0"
edition = "2021"

[lib]
name = "yonder_android_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies]
tauri-plugin-barcode-scanner = "2"
tauri-plugin-haptics = "2"
# The browser inside the app for Yonder Preview (Custom Tabs). See docs/tunnel.md.
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# The Face ID lock of the app (LocalAuthentication), and the fingerprint lock on Android. See "Phone" in docs/wiki.md.
tauri-plugin-biometric = "2"
