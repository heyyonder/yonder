[package]
name = "yonder"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
core-foundation = "0.10.1"
core-graphics = "0.25.0"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
# The plugins config in tauri.conf.json (the updater) makes generate_context! use serde_json.
serde_json = "1"
tauri-plugin-mcp-bridge = "0.13.1"
# Panics of the app go to Sentry (the project yonder). See "Crash reports" in docs/wiki/install.md.
sentry = "0.49.3"
