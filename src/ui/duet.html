<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Duet</title>
<style>
/* The look of Duet: warm paper, a serif title, and a pixel creature for each agent, with a shell color, a hat, eyewear
   and an extra. The colors of the screen are the tokens of screen.json; these are the parts that the tokens do not name. */
:root { --serif: ui-serif, "New York", "Iowan Old Style", Georgia, serif; --btn: var(--panel); --raise: 0 1px 3px rgba(70, 45, 20, 0.1), 0 0 0 1px rgba(70, 45, 20, 0.06); --stage: linear-gradient(#ffffff, #f0ece5); --floor: rgba(70, 45, 20, 0.16); --pix: #26242a; --tint: color-mix(in srgb, var(--accent) 10%, var(--panel)); --shade: rgba(30, 20, 10, 0.3); }
:root[data-theme="dark"] { --raise: 0 0 0 1px rgba(255, 255, 255, 0.08); --stage: linear-gradient(#2e2b27, #24211e); --floor: rgba(0, 0, 0, 0.5); --pix: #5a5560; --shade: rgba(0, 0, 0, 0.55); }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: var(--bg); color: var(--text); font: 16px/1.3 var(--sans, -apple-system, system-ui, sans-serif); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; margin: 0; cursor: pointer; -webkit-user-select: none; user-select: none; }
input, textarea { font: inherit; color: inherit; }
[hidden] { display: none !important; }
svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
svg.av { display: block; flex: none; overflow: visible; }
svg.av .floor { fill: var(--floor); }

.shell { position: fixed; inset: 0; display: flex; }
.home, .chat, .empty { position: relative; display: flex; flex-direction: column; min-width: 0; height: 100%; }
.home, .chat { flex: 1; }
body[data-view="chat"] .home, body[data-view="home"] .chat, .empty { display: none; }

.circ { display: grid; place-items: center; flex: none; width: 44px; height: 44px; border-radius: 50%; background: var(--btn); box-shadow: var(--raise); }
.circ.add { background: var(--accent); color: var(--accent-text); box-shadow: none; }
.circ:active, .row:active, .chip:active, .pill:active, .wide:active, .group button:active, .newbtn:active, .self:active, .tiles button:active, .swatches button:active, .surprise:active, .fab:active, .who:active, .link:active, .go:active { opacity: 0.6; }

/* The list of agents */
.top { flex: none; display: flex; align-items: center; justify-content: space-between; height: 60px; padding: 0 16px 0 12px; }
/* The button of the user, top left. Its class is not .me, which is a bubble of the user. */
.self { display: grid; place-items: center; width: 48px; height: 48px; }
.self svg.av { width: 48px; height: 48px; }
.tools { display: flex; gap: 10px; }
.trow { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 16px 0 20px; }
h1 { margin: 0; font: 500 32px/1.2 var(--serif); letter-spacing: -0.01em; white-space: nowrap; }
.trow y-projects { flex: 0 1 auto; }
y-projects .y-pill { height: 36px; padding: 0 12px; border-radius: 18px; background: var(--btn); box-shadow: var(--raise); font-size: 15px; }
.count { flex: none; margin: 0 20px; font-size: 15px; color: var(--muted); }
.search { flex: none; display: flex; align-items: center; gap: 8px; height: 44px; margin: 12px 16px 0; padding: 0 6px 0 14px; border-radius: 22px; background: var(--btn); box-shadow: var(--raise); color: var(--muted); }
.search input { flex: 1; min-width: 0; height: 100%; border: 0; background: none; outline: none; font-size: 16px; color: var(--text); }
.search input::placeholder { color: var(--muted); }
.search button { display: grid; place-items: center; width: 34px; height: 34px; }
.chips { flex: none; display: flex; gap: 8px; padding: 12px 16px 6px; overflow-x: auto; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; height: 34px; padding: 0 15px; border-radius: 17px; font-size: 15px; font-weight: 500; color: var(--muted); box-shadow: inset 0 0 0 1px var(--line); }
.chip[aria-selected="true"] { background: var(--tint); color: var(--accent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 35%, transparent); }
.list { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 4px 0 calc(88px + var(--under, 0px)); }
.row { display: flex; align-items: center; gap: 14px; width: 100%; padding: 0 0 0 16px; text-align: left; }
.row.on { background: var(--hover); }
.row svg.av { width: 48px; height: 48px; }
.txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; padding: 13px 18px 13px 0; box-shadow: inset 0 -1px var(--line); }
.row:last-child .txt { box-shadow: none; }
.l1, .l2 { display: flex; align-items: center; gap: 8px; min-width: 0; }
.nm { flex: 0 1 auto; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 17px; font-weight: 600; }
.num { font-weight: 400; color: var(--muted); }
.tag { flex: 0 1 auto; min-width: 0; max-width: 45%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; padding: 2px 7px; border-radius: 6px; background: var(--page); font-size: 12px; font-weight: 500; color: var(--muted); }
.tm { flex: none; margin-left: auto; font-size: 14px; color: var(--muted); }
.sub { flex: 0 1 auto; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 15px; color: var(--muted); }
.sub svg.i { width: 15px; height: 15px; margin-right: 6px; vertical-align: -2px; }
.act { color: var(--accent); }
.dots { flex: none; display: inline-flex; gap: 3px; color: var(--accent); }
.dots i { width: 5px; height: 5px; border-radius: 50%; background: currentColor; animation: blink 1.2s ease-in-out infinite; }
.dots i:nth-child(2) { animation-delay: 0.2s; }
.dots i:nth-child(3) { animation-delay: 0.4s; }
.bad { color: var(--red); font-weight: 500; }
.dot { flex: none; width: 9px; height: 9px; margin-left: auto; border-radius: 50%; background: var(--accent); }
.none { margin: 56px 20px; text-align: center; font-size: 15px; color: var(--muted); }
.fab { position: absolute; z-index: 2; right: 20px; bottom: calc(20px + var(--under, 0px)); display: grid; place-items: center; width: 58px; height: 58px; border-radius: 50%; background: var(--call); color: var(--call-text); box-shadow: 0 6px 18px rgba(40, 25, 10, 0.22); }
.fab svg.i { width: 24px; height: 24px; }
.fab.live { background: var(--live); color: #fff; }
.fab.wait { animation: pulse 1.2s ease-in-out infinite; }

/* A chat */
.ctop { position: absolute; z-index: 3; top: 0; left: 0; right: 0; height: 68px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; background: linear-gradient(var(--bg) 60%, transparent); pointer-events: none; }
.ctop > * { pointer-events: auto; }
.who { position: absolute; left: 50%; transform: translateX(-50%); max-width: calc(100% - 140px); display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 16px 0 6px; border-radius: 22px; background: var(--btn); box-shadow: var(--raise); font: 500 18px/1 var(--serif); }
.who svg.av { width: 32px; height: 32px; }
.who span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.msgs { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; gap: 8px; padding: 76px 16px 12px; }
.day { align-self: center; margin: 4px 0 10px; font-size: 13px; color: var(--muted); }
.b { max-width: min(84%, 640px); padding: 10px 15px; border-radius: 20px; font-size: 16px; line-height: 1.38; white-space: pre-wrap; overflow-wrap: anywhere; }
.b.me { align-self: flex-end; border-bottom-right-radius: 6px; background: var(--accent); color: var(--accent-text); }
.b.bot { align-self: flex-start; border-bottom-left-radius: 6px; background: var(--panel); box-shadow: var(--raise); }
.b.me + .b.bot, .b.bot + .b.me { margin-top: 10px; }
.b.wait { opacity: 0.55; }
.b code { font: 0.86em var(--mono, ui-monospace, monospace); }
.b pre { margin: 6px 0; padding: 10px 12px; border-radius: 12px; background: var(--page); font: 13px/1.45 var(--mono, ui-monospace, monospace); white-space: pre-wrap; }
.status { display: flex; align-items: center; gap: 8px; min-width: 0; margin-top: 8px; font-size: 15px; color: var(--accent); }
.status svg.av { width: 32px; height: 32px; }
.status span:not(.dots) { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.files { flex: none; display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px; }
.file { display: flex; align-items: center; gap: 4px; max-width: 100%; height: 34px; padding: 0 4px 0 12px; border-radius: 17px; background: var(--btn); box-shadow: var(--raise); font-size: 14px; }
.file span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.file button { display: grid; place-items: center; width: 28px; height: 28px; }
.file svg.i { width: 16px; height: 16px; }
.composer { flex: none; display: flex; align-items: flex-end; gap: 10px; padding: 8px 16px calc(10px + var(--under, 0px)); }
.composer .circ { width: 48px; height: 48px; }
.field { flex: 1; min-width: 0; display: flex; align-items: flex-end; gap: 6px; min-height: 48px; padding: 4px 4px 4px 16px; border-radius: 24px; background: var(--panel); box-shadow: var(--raise); }
.field textarea { flex: 1; min-width: 0; height: 40px; max-height: 132px; padding: 9px 0; border: 0; background: none; outline: none; resize: none; font-size: 16px; line-height: 22px; color: var(--text); }
.field textarea::placeholder { color: var(--muted); }
.mini { display: grid; place-items: center; flex: none; width: 40px; height: 40px; border-radius: 50%; color: var(--muted); }
.mini.send { background: var(--accent); color: var(--accent-text); }
.mini.rec { background: var(--red); color: #fff; }
/* Each control takes a tap of 44 px or more, also where it looks smaller. */
.chip, .mini, .file button, .search button, .go { position: relative; }
.chip::after { content: ""; position: absolute; inset: -5px 0; }
.mini::after { content: ""; position: absolute; inset: -2px; }
.file button::after, .search button::after, .go::after { content: ""; position: absolute; inset: -5px; }

/* An approval: a card with two buttons, in the list and in the chat */
.card { margin: 6px 16px 10px; padding: 14px 16px 16px; border-radius: 20px; background: var(--panel); box-shadow: var(--raise); }
.chat .card { margin: 0 16px 8px; }
.by { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
.by svg.av { width: 32px; height: 32px; }
.card h3 { margin: 8px 0 4px; font: 500 18px/1.25 var(--serif); overflow-wrap: anywhere; }
.card p { margin: 2px 0; font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }
.acts { display: flex; gap: 10px; margin-top: 14px; }
.pill { flex: 1; height: 44px; border-radius: 22px; box-shadow: inset 0 0 0 1px var(--line); font-size: 16px; font-weight: 600; }
.pill.main { background: var(--accent); color: var(--accent-text); box-shadow: none; }

/* Sheets from the bottom */
.layer { position: fixed; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.shade { position: absolute; inset: 0; background: var(--shade); animation: fade 0.25s ease; }
.sheet { position: relative; width: 100%; max-width: 500px; max-height: calc(100% - 24px); overflow-y: auto; padding: 12px 20px calc(20px + var(--under, 0px)); border-radius: 28px 28px 0 0; background: var(--bg); animation: up 0.34s cubic-bezier(0.2, 0.9, 0.25, 1); }
.sh { display: flex; align-items: center; gap: 14px; margin-bottom: 4px; }
.sh h2, .nhead h2 { margin: 0; font: 500 20px/1 var(--serif); }
.nhead { display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 44px; }
.link { min-width: 60px; height: 44px; font-size: 16px; color: var(--muted); text-align: left; }
.go { min-width: 60px; height: 36px; padding: 0 16px; border-radius: 18px; background: var(--accent); color: var(--accent-text); font-size: 15px; font-weight: 600; }
.stage { display: grid; place-items: center; width: 152px; height: 152px; margin: 6px auto 8px; border-radius: 30px; background: var(--stage); box-shadow: var(--raise); }
.stage svg.av { width: 128px; height: 128px; }
.pop { animation: pop 0.3s ease; }
.name { display: block; width: 100%; height: 44px; padding: 0 12px; border: 0; border-radius: 14px; background: none; outline: none; text-align: center; font: 500 26px/1 var(--serif); color: var(--text); }
.name:focus { background: var(--panel); box-shadow: var(--raise); }
.name::placeholder { color: var(--muted); }
.pick { margin-top: 12px; }
.ph { display: flex; justify-content: space-between; margin-bottom: 4px; font-size: 14px; line-height: 18px; }
.ph b { font-weight: 600; }
.ph span { color: var(--muted); }
.swatches { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); }
.swatches button { display: grid; place-items: center; height: 44px; }
.swatches i { display: block; width: 28px; height: 28px; border-radius: 50%; }
.swatches [aria-pressed="true"] i { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent); }
.tiles { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
.tiles button { display: grid; place-items: center; height: 52px; border-radius: 14px; background: var(--panel); box-shadow: var(--raise); color: var(--muted); }
.tiles svg.av { width: 48px; height: 48px; }
.tiles [aria-pressed="true"] { background: var(--tint); box-shadow: inset 0 0 0 2px var(--accent); }
.surprise { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 48px; margin-top: 16px; border-radius: 16px; background: var(--panel); box-shadow: var(--raise); font-size: 16px; font-weight: 600; }
/* A short phone, such as the iPhone SE: the same sheet, smaller, so it still fits with no scroll. */
@media (max-height: 700px) {
  .stage { width: 120px; height: 120px; margin: 2px auto 4px; border-radius: 26px; }
  .stage svg.av { width: 96px; height: 96px; }
  .name { height: 40px; font-size: 24px; }
  .pick { margin-top: 8px; }
  .ph { margin-bottom: 2px; font-size: 13px; line-height: 16px; }
  .swatches button { height: 40px; }
  .tiles button { height: 46px; }
  .tiles svg.av { width: 32px; height: 32px; }
  .surprise { height: 44px; margin-top: 12px; }
}
.wide { display: block; width: 100%; height: 52px; margin-top: 10px; border-radius: 16px; background: var(--panel); box-shadow: var(--raise); font-size: 16px; font-weight: 600; }
.group { overflow: hidden; border-radius: 18px; background: var(--panel); box-shadow: var(--raise); }
.group button { display: flex; align-items: center; gap: 14px; width: 100%; height: 54px; padding: 0 18px; text-align: left; font-size: 16px; }
.group button + button { box-shadow: inset 0 1px var(--line); }
.group .bad { font-weight: 400; }
.apps { display: flex; flex-direction: column; gap: 2px; margin-top: 10px; }
.app { display: flex; align-items: center; gap: 14px; width: 100%; padding: 10px 4px; text-align: left; }
.ico { display: grid; place-items: center; flex: none; width: 44px; height: 44px; overflow: hidden; border-radius: 12px; background: var(--panel); box-shadow: var(--raise); font-size: 22px; font-weight: 600; }
.ico img { width: 28px; height: 28px; object-fit: contain; }
.app b { display: block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 16px; font-weight: 600; }
.app small { font-size: 13px; color: var(--muted); }
.apps.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px 8px; }
.apps.grid .app { flex-direction: column; gap: 6px; padding: 4px 0; text-align: center; min-width: 0; }
.apps.grid .ico { width: 60px; height: 60px; border-radius: 16px; }
.apps.grid .app span { width: 100%; min-width: 0; }
.apps.grid small { display: none; }
.apps.grid b { font-size: 12px; font-weight: 500; }
.toast { position: fixed; z-index: 30; top: 12px; left: 50%; transform: translateX(-50%); max-width: calc(100% - 32px); padding: 10px 16px; border-radius: 20px; background: var(--text); color: var(--bg); font-size: 15px; animation: fade 0.2s ease; }

/* The Mac and wide windows: the list on the left and the chat on the right */
.blob { position: absolute; transform: translate(-50%, -50%); animation: bob 3.2s ease-in-out infinite; }
.blob svg.av { width: 100%; height: 100%; }
.newbtn { position: relative; height: 48px; padding: 0 22px; border-radius: 24px; background: var(--accent); color: var(--accent-text); font-size: 16px; font-weight: 600; }
@media (min-width: 720px) {
  body[data-view] .home { display: flex; flex: none; width: 360px; box-shadow: inset -1px 0 var(--line); }
  body[data-view="home"] .empty { display: flex; flex: 1; align-items: center; justify-content: center; overflow: hidden; }
  #back { visibility: hidden; }
}
@media (max-width: 719px) { .chat.in { animation: push 0.3s cubic-bezier(0.2, 0.9, 0.25, 1); } }

@keyframes up { from { transform: translateY(100%); } }
@keyframes fade { from { opacity: 0; } }
@keyframes push { from { transform: translateX(40%); opacity: 0; } }
@keyframes pop { 50% { transform: scale(1.1); } }
@keyframes pulse { 50% { opacity: 0.5; } }
@keyframes blink { 50% { opacity: 0.25; } }
@keyframes bob { 50% { transform: translate(-50%, calc(-50% - 6px)); } }
@media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } }
</style>
</head>
<body data-view="home">
<div class="shell">
  <section class="home">
    <header class="top">
      <button class="self" id="me" aria-label="Settings"></button>
      <div class="tools">
        <button class="circ" id="apps" aria-label="Apps"></button>
        <button class="circ" id="find" aria-label="Search"></button>
        <button class="circ add" id="new" aria-label="New"></button>
      </div>
    </header>
    <div class="trow"><h1 id="title"></h1><y-projects></y-projects></div>
    <p class="count" id="count"></p>
    <label class="search" id="search" hidden><span id="lens"></span><input id="q" placeholder="Search" autocomplete="off" aria-label="Search"><button id="unfind" aria-label="Close the search"></button></label>
    <nav class="chips" id="chips"></nav>
    <main class="list" id="list"></main>
    <button class="fab" id="call" aria-label="Call"></button>
  </section>
  <section class="chat" id="chat">
    <header class="ctop">
      <button class="circ" id="back" aria-label="Back"></button>
      <button class="who" id="who" aria-label="Edit the look"></button>
      <button class="circ" id="more" aria-label="More"></button>
    </header>
    <main class="msgs" id="msgs"></main>
    <div id="asks"></div>
    <div class="files" id="files"></div>
    <footer class="composer">
      <button class="circ" id="attach" aria-label="Attach"></button>
      <div class="field">
        <textarea id="text" rows="1" placeholder="Message" aria-label="Message"></textarea>
        <button class="mini" id="mic" aria-label="Dictate"></button>
        <button class="mini send" id="send" aria-label="Send" hidden></button>
      </div>
    </footer>
  </section>
  <section class="empty" id="empty"></section>
</div>
<script>
(() => {
  const Y = window.yonder;
  const W = Object.assign({ one: "agent", many: "agents", One: "Agent", Many: "Agents" }, Y.word || {});
  const root = document.documentElement;
  // The app sets the look on <html>. A test page in a browser has none, so it follows the browser.
  if (!root.dataset.theme) root.dataset.theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => "&#" + c.charCodeAt(0) + ";");

  const I = {
    plus: '<path d="M12 5v14M5 12h14"/>',
    search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
    grid: '<rect x="4" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.6"/><path d="M16.75 13.5v6.5M13.5 16.75H20"/>',
    phone: '<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/>',
    back: '<path d="m15 18-6-6 6-6"/>',
    dots: '<circle cx="5" cy="12" r="1.7" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.7" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.7" fill="currentColor" stroke="none"/>',
    mic: '<rect x="9" y="2.5" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3.5"/>',
    up: '<path d="M12 19V5M5.5 11.5 12 5l6.5 6.5"/>',
    x: '<path d="M18 6 6 18M6 6l12 12"/>',
    stop: '<rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor" stroke="none"/>',
    camera: '<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"/><circle cx="12" cy="13" r="3"/>',
    photo: '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/>',
    file: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>',

      const b = e.target.closest("[data-act]");
      if (!b) return;
      closeSheet();
      const act = b.dataset.act;
      if (act === "edit") return lookSheet(m);
      // The list changes at once. A failure loads the true list again.
      if (act === "close") (mice = mice.filter((x) => x.id !== m.id)), back();
      else (m.status = act === "done" ? "done" : "waiting"), redraw();
      Y.mice[act](m.id).catch((err) => (fail(err), Y.mice.list().then((l) => ((mice = l || []), redraw()), () => {})));
    });
  }
  function attachSheet() {
    const kinds = computer() ? [["file", "File"], ["paste", "Paste"]] : [["camera", "Camera"], ["photo", "Photos"], ["file", "Files"], ["paste", "Paste"], ["location", "Location"]];
    const s = sheet(`<div class="group">${kinds.map(([k, t]) => `<button data-att="${k}">${icon(k)}<span>${t}</span></button>`).join("")}</div><button class="wide" data-close>Cancel</button>`);
    s.addEventListener("click", async (e) => {
      const b = e.target.closest("[data-att]");
      if (!b) return;
      closeSheet();
      try {
        const got = Y.attach && (await Y.attach[b.dataset.att]());
        if (got && got.path) files.push(got.path), drawFiles(), drawSend();
      } catch (err) { fail(err); }
    });
  }
  async function appsSheet() {
    const s = sheet(`<div class="sh"><button class="circ" data-close aria-label="Close">${icon("x")}</button><h2>Apps</h2></div><div class="apps" id="applist"></div>`);
    let list = [], grid = false;
    try { [list, grid] = await Promise.all([Y.apps.list(), Y.settings.get().then((v) => v && v.appsView === "grid", () => false)]); } catch { list = []; }
    const pic = (a) => {
      const i = String(a.icon || "");
      if (i.startsWith("<svg")) return `<img alt="" src="data:image/svg+xml;charset=utf-8,${encodeURIComponent(i)}">`;
      if (i.startsWith("data:image/")) return `<img alt="" src="${esc(i)}">`;
      return esc(i && i.length <= 4 ? i : (a.title || "?").slice(0, 1).toUpperCase());
    };
    const box = s.querySelector("#applist");
    box.classList.toggle("grid", grid);
    box.innerHTML = list.length ? list.map((a) => `<button class="app" data-app="${esc(a.id)}"><span class="ico">${pic(a)}</span><span><b>${esc(a.title)}</b><small>${esc(when(a.at))}</small></span></button>`).join("") : `<p class="none">No apps</p>`;
    box.onclick = (e) => { const b = e.target.closest("[data-app]"); if (b) closeSheet(), Y.apps.open(b.dataset.app).catch(fail); };
  }

  // Writing and sending
  function drawFiles() {
    $("files").innerHTML = files.map((p, i) => `<span class="file"><span>${esc(p.split("/").pop())}</span><button data-drop="${i}" aria-label="Remove">${icon("x")}</button></span>`).join("");
  }
  const grow = () => { const t = $("text"); t.style.height = "40px"; t.style.height = Math.min(t.scrollHeight, 132) + "px"; };
  const drawSend = () => { const has = !!$("text").value.trim() || files.length > 0; $("send").hidden = !has || dictating; $("mic").hidden = has && !dictating; };
  async function send() {
    const box = $("text"), text = box.value.trim(), paths = files.slice();
    if (!text && !paths.length) return;
    const k = key();
    (pending[k] = pending[k] || []).push(text || "📎");
    box.value = ""; files = []; grow(); drawFiles(); drawSend(); drawMsgs(true);
    try {
      if (open.draft) {
        const d = draft;
        // No surprise look goes to the new agent while it starts: it takes the look of the draft.
        starting++;
        try {
          const r = await Y.mice.start(text, project.path === "*" ? "" : project.path, paths);
          const num = r && r.num;
          pending[num] = pending.draft; delete pending.draft;
          picked[num] = d.avatar;
          if (d.name) named[num] = d.name;
          if (open && open.draft) open = { id: r && r.id, num }, (draft = null), drawChat(), poll();
          // The new agent takes its name and its look by its number, because its id changes when its session starts.
          if (d.name) await Y.mice.rename(String(num), d.name);
          if (Y.mice.avatar) await Y.mice.avatar(String(num), toAvatar(d.avatar));
        } finally { starting--; }
      } else {
        await Y.mice.send(current() ? current().id : open.id, text, paths);
        loadTurns();
      }
    } catch (e) {
      if (pending[k]) pending[k] = pending[k].filter((p) => p !== (text || "📎"));
      if (!box.value) box.value = text;
      grow(); drawSend(); if (open) drawMsgs(); fail(e);
    }
  }
  async function dictate() {
    if (dictating) {
      dictating = false; drawMic();
      try { const t = await Y.dictation.stop(); if (typeof t === "string" && t.trim()) $("text").value = `${before} ${t}`.trim(); } catch (e) { fail(e); }
      grow(); drawSend();
      return;
    }
    before = $("text").value.trim();
    try { await Y.dictation.start(); dictating = true; drawMic(); } catch (e) { fail(e); }
  }
  function stopDictation() { if (dictating) (dictating = false), Y.dictation.cancel().catch(() => {}), drawMic(); }
  const drawMic = () => { $("mic").classList.toggle("rec", dictating); $("mic").innerHTML = icon(dictating ? "stop" : "mic"); drawSend(); };
  Y.dictation.on((v) => {
    if (!dictating || !v) return;
    if (v.error) return (dictating = false), drawMic(), toast(v.error);
    if (typeof v.text === "string") $("text").value = `${before} ${v.text}`.trim(), grow();
  });

  // The call
  function drawCall() {
    const b = $("call");
    b.hidden = computer();
    b.classList.toggle("live", call.phase === "live");
    b.classList.toggle("wait", call.phase === "connecting");
    b.setAttribute("aria-label", call.phase === "idle" ? "Call" : "End the call");
  }
  $("call").onclick = async () => {
    try { call = call.phase === "idle" ? await Y.call.start() : await Y.call.end(); } catch (e) { fail(e); }
    drawCall();
  };

  async function answer(id, allow) {
    approvals = approvals.filter((a) => a.id !== id);
    drawList(); if (open) drawAsks();
    try { await Y.approvals.answer(id, allow); } catch (e) { fail(e); }
    loadAsks();
  }
  const loadAsks = () => Y.approvals.list().then((list) => { approvals = list || []; drawList(); if (open) drawAsks(); }, () => {});
  function redraw() { drawList(); if (open) drawChat(); }

  // The buttons
  $("me").innerHTML = bot({ color: SHELLS[0][1], hat: "no", eye: "no", extra: "no" });
  $("apps").innerHTML = icon("grid");
  $("find").innerHTML = icon("search");
  $("new").innerHTML = icon("plus");
  $("lens").innerHTML = icon("search");
  $("unfind").innerHTML = icon("x");
  $("call").innerHTML = icon("phone");
  $("back").innerHTML = icon("back");
  $("more").innerHTML = icon("dots");
  $("attach").innerHTML = icon("plus");
  $("mic").innerHTML = icon("mic");
  $("send").innerHTML = icon("up");
  $("me").onclick = () => Y.settings.open().catch(fail);
  $("new").onclick = startDraft;
  $("apps").onclick = appsSheet;
  $("find").onclick = () => { $("search").hidden = false; $("q").focus(); };
  $("unfind").onclick = (e) => { e.preventDefault(); $("search").hidden = true; $("q").value = query = ""; drawList(); };
  $("back").onclick = back;
  $("more").onclick = moreSheet;
  $("who").onclick = () => (open && open.draft ? lookSheet(null) : current() && lookSheet(current()));
  $("attach").onclick = attachSheet;
  $("send").onclick = send;
  $("mic").onclick = dictate;
  $("q").oninput = (e) => ((query = e.target.value), drawList());
  $("text").oninput = () => (grow(), drawSend());
  // On the Mac, Return sends and Shift-Return makes a new line. On the phone, the Return key makes a new line.
  $("text").onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing && computer()) e.preventDefault(), send(); };
  // A tap on the box of the text, outside the text, also starts to write.
  document.querySelector(".field").onclick = (e) => e.target === e.currentTarget && $("text").focus();
  $("files").onclick = (e) => { const b = e.target.closest("[data-drop]"); if (b) files.splice(Number(b.dataset.drop), 1), drawFiles(), drawSend(); };
  $("empty").onclick = (e) => e.target.closest("[data-new]") && startDraft();
  const onAsk = (e) => { const b = e.target.closest("[data-ask]"); if (b) answer(b.dataset.ask, !!b.dataset.allow); return !!b; };
  $("asks").onclick = onAsk;
  $("list").onclick = (e) => {
    if (onAsk(e)) return;
    const b = e.target.closest("[data-num]");
    const m = b && mouseOf(Number(b.dataset.num));
    if (m) openChat(m);
  };
  $("chips").onclick = async (e) => {
    const b = e.target.closest("[data-tab]");
    if (!b) return;
    tab = b.dataset.tab;
    drawList();
    if (tab === "closed") closed = await Y.mice.closed().catch(() => []), drawList();
  };
  addEventListener("resize", () => drawEmpty());
  // The keyboard makes the chat shorter. A chat at its end stays at its end, so the last message shows over the keyboard.
  // `gap` is the distance to the end before the change of size: the browser can scroll the chat when its size changes,
  // before the ResizeObserver runs, so a scroll at a size that the observer has not seen does not count.
  const chat = $("msgs");
  let gap = 0, seen = 0;
  chat.addEventListener("scroll", () => chat.clientHeight === seen && (gap = chat.scrollHeight - chat.scrollTop - chat.clientHeight));
  new ResizeObserver(() => ((seen = chat.clientHeight), gap < 60 && (chat.scrollTop = chat.scrollHeight))).observe(chat);
  // iOS can scroll a page to show a text field, also a page that does not scroll. The page goes back to the top.
  addEventListener("scroll", () => (scrollX || scrollY) && scrollTo(0, 0));

  // The data
  Y.mice.on((list) => {
    mice = list || [];
    // A pick leaves its waiting place when the bridge has it.
    for (const m of mice) {
      const p = picked[m.num];
      if (p && m.avatar && m.avatar.shape === toAvatar(p).shape && m.avatar.color === p.color) delete picked[m.num];
      if (named[m.num] && m.name === named[m.num]) delete named[m.num];
    }
    if (tab === "closed") Y.mice.closed().then((c) => ((closed = c || []), drawList()), () => {});
    autoLooks();
    redraw();
    loadAsks();
  });
  Y.projects.on((p) => ((project = p || project), drawList()));
  Y.call.on((s) => ((call = s || call), drawCall()));
  drawList();
  drawMic();
  drawCall();
  Y.ready();
  Promise.all([Y.mice.list(), Y.projects.current(), Y.call.state()]).then(([list, p, c]) => {
    mice = list || []; project = p || project; call = c || call;
    autoLooks(); drawCall(); redraw(); loadAsks();
  }, fail);
})();
</script>
</body>
</html>
